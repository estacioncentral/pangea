<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AOI DETAIL — H3 r9 · k-ring 1</title>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
<script src="https://unpkg.com/h3-js@4"></script>
<style>
  :root {
    --cyan: #00e5ff;
    --cyan-dim: rgba(0,229,255,0.55);
    --cyan-faint: rgba(0,229,255,0.18);
    --amber: #ffaa00;
    --bg-deep: #000308;
    --panel: rgba(0,16,32,0.78);
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg-deep);
    color: var(--cyan);
    font-family: 'Courier New', 'Consolas', monospace;
    overflow: hidden;
    letter-spacing: 0.04em;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }
  #main { flex: 1; position: relative; }
  #cesiumMain { width: 100%; height: 100%; }
  #picker {
    height: 180px;
    position: relative;
    border-top: 1px solid var(--cyan-dim);
    background: var(--bg-deep);
  }
  #cesiumPicker { width: 100%; height: 100%; cursor: crosshair; }

  /* Strip default Cesium chrome on both viewers */
  .cesium-viewer-bottom,
  .cesium-widget-credits,
  .cesium-credit-logoContainer,
  .cesium-credit-textContainer { display: none !important; }

  #hud {
    position: absolute; top: 14px; left: 14px;
    padding: 12px 16px;
    background: var(--panel);
    border: 1px solid var(--cyan-dim);
    font-size: 11px;
    z-index: 10;
    min-width: 260px;
    backdrop-filter: blur(2px);
    box-shadow: 0 0 24px rgba(0,229,255,0.08) inset;
  }
  #hud h2 {
    font-size: 10px; margin: 0 0 10px 0;
    color: var(--cyan); letter-spacing: 0.25em;
    font-weight: normal;
    border-bottom: 1px solid var(--cyan-faint);
    padding-bottom: 6px;
  }
  #hud .row {
    display: flex; justify-content: space-between;
    padding: 3px 0;
    font-size: 11px;
  }
  #hud .label { color: rgba(0,229,255,0.5); }
  #hud .val { color: #e0f7ff; }
  #hud .val.warm { color: var(--amber); }

  #hint {
    position: absolute; top: 8px; left: 50%;
    transform: translateX(-50%);
    padding: 5px 14px;
    background: var(--panel);
    border: 1px solid var(--cyan-dim);
    font-size: 10px;
    z-index: 10;
    pointer-events: none;
    letter-spacing: 0.3em;
    color: var(--cyan);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }

  #status {
    position: absolute; bottom: 10px; right: 14px;
    padding: 4px 10px;
    background: var(--panel);
    border: 1px solid var(--cyan-dim);
    font-size: 10px;
    z-index: 10;
    letter-spacing: 0.2em;
    color: var(--cyan);
  }
  #status.warn { color: var(--amber); border-color: var(--amber); }

  #legend {
    position: absolute; bottom: 10px; left: 14px;
    padding: 8px 12px;
    background: var(--panel);
    border: 1px solid var(--cyan-dim);
    font-size: 10px;
    z-index: 10;
    letter-spacing: 0.15em;
  }
  #legend .swatch {
    display: inline-block;
    width: 10px; height: 10px;
    margin-right: 6px;
    vertical-align: middle;
    border: 1px solid currentColor;
  }
  #legend .row { padding: 2px 0; }

  /* Scanline overlay for extra holo flavor */
  #main::after {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,229,255,0.015) 0,
      rgba(0,229,255,0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 5;
    mix-blend-mode: screen;
  }
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <div id="cesiumMain"></div>
    <div id="hud">
      <h2>AOI READOUT</h2>
      <div class="row"><span class="label">TARGET</span><span class="val" id="hudCtr">— , —</span></div>
      <div class="row"><span class="label">CENTER CELL</span><span class="val warm" id="hudCell">—</span></div>
      <div class="row"><span class="label">RES</span><span class="val">9</span></div>
      <div class="row"><span class="label">K-RING</span><span class="val">1 · 7 CELLS</span></div>
      <div class="row"><span class="label">SSE</span><span class="val">0.3</span></div>
      <div class="row"><span class="label">CONTOUR</span><span class="val">10 M</span></div>
      <div class="row"><span class="label">TERRAIN</span><span class="val">CESIUM WORLD</span></div>
    </div>
    <div id="legend">
      <div class="row" style="color: var(--amber);"><span class="swatch" style="background: var(--amber);"></span>CENTER</div>
      <div class="row" style="color: var(--cyan);"><span class="swatch" style="background: var(--cyan);"></span>RING 1</div>
    </div>
    <div id="status">BOOT</div>
  </div>
  <div id="picker">
    <div id="cesiumPicker"></div>
    <div id="hint">▼ CLICK ANYWHERE TO PICK AOI ▼</div>
  </div>
</div>

<script>
(async () => {
  if (typeof window.Cesium === 'undefined') throw new Error('Cesium failed to load from CDN.');
  if (typeof window.h3 === 'undefined') throw new Error('h3-js failed to load from CDN.');

  // ============================================================
  // CONFIG
  // ============================================================
  const H3_RES = 9;
  const K_RING = 1;
  const SSE = 0.3;
  const CONTOUR_SPACING_M = 10;

  Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIxZDg4N2JhMy0yYjZmLTQyNWYtOWYxOS0wOTgzYzdiMTAyN2MiLCJpZCI6NDAwNDE5LCJpYXQiOjE3NzMwMDIxMzd9._lZyiTNSuapslmg-vfAwvD3pp0zKtXjW94l3hIpDq_8';

  const $ = id => document.getElementById(id);
  const setStatus = (txt, warn = false) => {
    const el = $('status');
    el.textContent = txt;
    el.classList.toggle('warn', !!warn);
  };

  // ============================================================
  // MAIN 3D VIEWER  ── high-detail AOI viewer
  // ============================================================
  setStatus('TERRAIN');
  const terrain = Cesium.Terrain.fromWorldTerrain({ requestVertexNormals: true });
  terrain.errorEvent.addEventListener(err => {
    console.error('Terrain error:', err);
    setStatus('NO TERRAIN', true);
  });

  const main = new Cesium.Viewer('cesiumMain', {
    terrain,
    baseLayer: false,                    // no imagery — pure hologram
    animation: false, timeline: false, baseLayerPicker: false,
    geocoder: false, homeButton: false, sceneModePicker: false,
    navigationHelpButton: false, fullscreenButton: false,
    infoBox: false, selectionIndicator: false, shouldAnimate: false,
  });

  // Push terrain detail aggressively — this is the whole point of AOI mode
  main.scene.globe.maximumScreenSpaceError = SSE;
  main.scene.globe.tileCacheSize = 1000;
  main.scene.globe.preloadAncestors = true;
  main.scene.globe.preloadSiblings = true;

  // Holographic aesthetic
  main.scene.skyAtmosphere.show = false;
  main.scene.globe.showGroundAtmosphere = false;
  main.scene.globe.enableLighting = false;
  main.scene.fog.enabled = false;
  main.scene.globe.showWaterEffect = false;
  main.scene.backgroundColor = Cesium.Color.fromCssColorString('#000308');
  main.scene.skyBox.show = false;
  main.scene.globe.baseColor = Cesium.Color.fromCssColorString('#001428');

  // Tight contour spacing — at AOI scale this gives rich micro-topography
  main.scene.globe.material = Cesium.Material.fromType('ElevationContour', {
    spacing: CONTOUR_SPACING_M,
    color: Cesium.Color.CYAN.withAlpha(0.7),
    width: 1.0,
  });

  // Bloom for the holo glow
  const bloom = main.scene.postProcessStages.bloom;
  bloom.enabled = true;
  bloom.uniforms.contrast = 1.15;
  bloom.uniforms.brightness = -0.18;
  bloom.uniforms.delta = 1.0;
  bloom.uniforms.sigma = 2.0;
  bloom.uniforms.stepSize = 1.0;
  bloom.uniforms.glowOnly = false;

  // Drop default double-click track behavior
  main.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);

  // Start zoomed out
  main.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(0, 0, 20000000),
  });

  // ============================================================
  // PICKER 2D VIEWER  ── world map at the bottom
  // ============================================================
  const picker = new Cesium.Viewer('cesiumPicker', {
    sceneMode: Cesium.SceneMode.SCENE2D,
    mapProjection: new Cesium.WebMercatorProjection(),
    animation: false, timeline: false, baseLayerPicker: false,
    geocoder: false, homeButton: false, sceneModePicker: false,
    navigationHelpButton: false, fullscreenButton: false,
    infoBox: false, selectionIndicator: false, shouldAnimate: false,
  });

  // Lock the picker — no pan/zoom, only click
  const ssc = picker.scene.screenSpaceCameraController;
  ssc.enableRotate = false;
  ssc.enableTranslate = false;
  ssc.enableZoom = false;
  ssc.enableTilt = false;
  ssc.enableLook = false;

  picker.scene.backgroundColor = Cesium.Color.fromCssColorString('#000308');
  picker.scene.globe.baseColor = Cesium.Color.fromCssColorString('#001428');
  picker.scene.skyAtmosphere.show = false;
  picker.scene.globe.showGroundAtmosphere = false;
  picker.scene.fog.enabled = false;

  // Fit world
  picker.camera.flyHome(0);

  // Marker shows last-picked spot
  let pickerMarker = null;
  function setPickerMarker(lat, lon) {
    if (pickerMarker) picker.entities.remove(pickerMarker);
    pickerMarker = picker.entities.add({
      position: Cesium.Cartesian3.fromDegrees(lon, lat),
      point: {
        pixelSize: 12,
        color: Cesium.Color.fromCssColorString('#ffaa00'),
        outlineColor: Cesium.Color.fromCssColorString('#ffffff'),
        outlineWidth: 2,
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
      },
    });
  }

  // Click → pick lat/lon → hand off to main viewer
  const pickerHandler = new Cesium.ScreenSpaceEventHandler(picker.canvas);
  pickerHandler.setInputAction(click => {
    const cart = picker.camera.pickEllipsoid(click.position, picker.scene.globe.ellipsoid);
    if (!cart) return;
    const carto = Cesium.Cartographic.fromCartesian(cart);
    const lat = Cesium.Math.toDegrees(carto.latitude);
    const lon = Cesium.Math.toDegrees(carto.longitude);
    loadAOI(lat, lon);
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

  // ============================================================
  // AOI LOADER  ── the actual capability we're testing
  // ============================================================
  const cellEntities = [];

  function clearAOI() {
    cellEntities.forEach(e => main.entities.remove(e));
    cellEntities.length = 0;
  }

  async function loadAOI(lat, lon) {
    setStatus('COMPUTE');
    clearAOI();

    const centerCell = h3.latLngToCell(lat, lon, H3_RES);
    const cells = h3.gridDisk(centerCell, K_RING);

    $('hudCtr').textContent = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
    $('hudCell').textContent = centerCell;
    setPickerMarker(lat, lon);

    // Build entities + accumulate boundary points for camera framing
    const allPoints = [];
    for (const id of cells) {
      const isCenter = id === centerCell;
      const boundary = h3.cellToBoundary(id);          // [[lat, lng], ...] CCW
      const flat = boundary.flatMap(([la, ln]) => [ln, la]);
      const closed = [...flat, flat[0], flat[1]];

      // Bright outline, clamped to terrain so it hugs slope
      cellEntities.push(main.entities.add({
        polyline: {
          positions: Cesium.Cartesian3.fromDegreesArray(closed),
          width: isCenter ? 3.5 : 2,
          material: isCenter
            ? Cesium.Color.fromCssColorString('#ffaa00')
            : Cesium.Color.fromCssColorString('#00e5ff'),
          clampToGround: true,
        },
      }));

      // Subtle terrain-classified fill so cells read as regions
      cellEntities.push(main.entities.add({
        polygon: {
          hierarchy: Cesium.Cartesian3.fromDegreesArray(flat),
          material: isCenter
            ? Cesium.Color.fromCssColorString('#ffaa00').withAlpha(0.10)
            : Cesium.Color.fromCssColorString('#00e5ff').withAlpha(0.04),
          classificationType: Cesium.ClassificationType.TERRAIN,
        },
      }));

      for (const [la, ln] of boundary) {
        allPoints.push(Cesium.Cartesian3.fromDegrees(ln, la));
      }
    }

    // Frame obliquely on the union of cells
    const bs = Cesium.BoundingSphere.fromPoints(allPoints);
    setStatus('FLYING');
    main.camera.flyToBoundingSphere(bs, {
      duration: 2.8,
      offset: new Cesium.HeadingPitchRange(
        0,
        Cesium.Math.toRadians(-40),
        Math.max(bs.radius * 4.5, 1200),
      ),
      complete: () => setStatus('LOCK'),
    });
  }

  // ============================================================
  // STARTUP — pre-pick Medellín so there's something visible
  // ============================================================
  setStatus('READY');
  setTimeout(() => loadAOI(6.2442, -75.5812), 700);
})();
</script>
</body>
</html>
